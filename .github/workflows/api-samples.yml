# Captures live responses of the free APIs listed in tools/api_samples/urls.txt from GitHub's
# network, prints their shape to the log and publishes the raw bodies as one commit on the
# `api-samples` branch (replaced on every run), where fixtures can be built from real payloads.
name: api-samples

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/api_samples/**'
      - '.github/workflows/api-samples.yml'

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Capture samples
        run: python3 tools/api_samples/capture.py tools/api_samples/urls.txt "$RUNNER_TEMP/api-samples"
      - name: Publish to the api-samples branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/api-samples"
          git init -q -b api-samples
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "API samples from ${GITHUB_REF_NAME}@${GITHUB_SHA::7}"
          git push --force --quiet "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/api-samples
