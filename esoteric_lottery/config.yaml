# Esoteric lottery research pipeline – configuration.
#
# Everything that influences a number is here and was fixed BEFORE the first backtest
# run (pre-registration). Nothing in this file may be changed in response to evaluation
# results; see README.md, "Protokol".

seed: 20261023            # global seed: seeded casts/shuffles, bootstrap, Monte Carlo

subject:
  name: null              # querent's full name; null -> name-based numerology/gematria are skipped
  birth_date: "1991-05-31"
  birth_time: "18:20"     # local civil time (zoneinfo gives CEST, UTC+2, for this date)
  birth_place:
    name: Zadar
    lat: 44.1194           # city centre, GeoNames
    lon: 15.2314
    tz: Europe/Zagreb

draw:
  date: "2026-10-23"
  time: "19:00"            # local civil time (CEST, UTC+2; DST ends 2026-10-25)
  place:
    name: Zagreb
    lat: 45.8150
    lon: 15.9819
    tz: Europe/Zagreb

games:
  sve_ili_nista:
    label: "Sve ili Ništa 11/22"
    pools:
      - {name: main, size: 22, pick: 11}
  eurojackpot:
    label: "Eurojackpot 5/50 + 2/12"
    pools:
      - {name: main, size: 50, pick: 5}
      - {name: euro, size: 12, pick: 2}
  loto:
    label: "Loto 6/45"
    pools:
      - {name: main, size: 45, pick: 6}
  joker:
    label: "Joker (6 znamenki)"
    pools:
      - {name: digits, size: 10, pick: 6, kind: digits}

methods:
  meihua:
    hour_basis: true_solar      # true_solar (sundial time, traditional) | civil
  iching:
    casts: 12                   # yarrow-stalk hexagrams cast per reading
  western_astrology:
    house_system: P             # Placidus
    orbs: {conjunction: 8.0, opposition: 8.0, trine: 6.0, square: 6.0, sextile: 4.0}
  vedic_astrology: {}
  pythagorean: {}
  chaldean: {}
  gematria:
    extra_texts: []             # optional Hebrew or Greek text (e.g. a name in Hebrew script)
  tarot:
    spread_size: 22
  lenormand: {}
  hermetic: {}

history:
  sve_ili_nista:
    csv: data/sve_ili_nista_sva_kola.csv
    sep: ";"
    encoding: utf-8-sig
    date_column: Datum
    date_format: "%d.%m.%Y"
    label_columns: [Godina, Kolo]
    expected_frequency: daily
    draw_time: "19:00"          # ASSUMPTION: the files carry no draw time; the target draw time is reused
    pools:
      main: [B1, B2, B3, B4, B5, B6, B7, B8, B9, B10, B11]
    checks: {sum_column: Zbroj, even_column: Parni}
    crosscheck_xlsx:
      path: data/Sve_ili_Nista_sva_kola.xlsx
      sheet: "Izvlačenja"
      date_column: Datum
      columns: [B1, B2, B3, B4, B5, B6, B7, B8, B9, B10, B11]
  eurojackpot: null             # no historical file supplied -> no backtest
  joker: null                   # no historical file supplied -> no backtest

portfolio:
  # Choosing which m of the candidate tickets to play TOGETHER. This cannot improve any
  # single ticket (impossible), and cannot change the expected total hits (m x 5.5); it
  # only decorrelates the m outcomes, which raises P(at least one ticket wins something).
  # The objective depends on the pairwise overlaps alone, never on the drawn numbers.
  enabled: true
  tickets: 4
  # Paying hit counts of Sve ili Ništa: symmetric tails. 11 or 0 is the jackpot tier,
  # then 10/1, 9/2, 8/3; 4-7 pays nothing. The tier STRUCTURE agrees across public
  # sources (lutrija.hr blocks automated access); the prize AMOUNTS do not, so no money
  # figure is computed anywhere in this project.
  paying_hits:
    sve_ili_nista: [0, 1, 2, 3, 8, 9, 10, 11]
    # Loto 6/45 pays only at the high end: 6, 5+bonus, 5, 4 and 3 hits. Here a "hit" is
    # how many of the 6 drawn numbers lie inside the played system, so a full system of
    # 7 numbers wins something exactly when at least 3 of the 6 are among those 7.
    loto: [3, 4, 5, 6]
  top_hits:
    sve_ili_nista: [0, 11]   # both ends are the jackpot tier
    loto: [6]
  # A full system of s numbers is played as all C(s, 6) combinations. The system is the
  # method's own top s numbers, taken from the ranking it already produces.
  system_size:
    loto: 7
  tickets_per_game:
    loto: 5
  # Windows of each method's ranking to offer as candidate systems: its top 7, its next
  # 7, and so on. One method's windows are disjoint, which is what a many-system packing
  # needs; 6 windows of 7 use 42 of the 45 numbers.
  system_slices:
    loto: 6
  # Packing a large set: a pair of systems sharing 3 numbers would cover the same triple
  # twice, and a triple inside a system is exactly what wins the lowest tier, so the
  # limit is 2. Greedy packing is used when exhaustive search is impossible.
  greedy_above_tickets: 6
  # The companion number played alongside each system; every selected ticket gets a
  # distinct one, since repeating a Joker cannot raise the chance that one of them wins.
  companion_game: joker
  max_overlap_for_packing:
    loto: 2
  # Which pairwise overlaps a candidate set may have, per game.
  # Sve ili Ništa: a pair overlapping in 0 numbers is complementary (hits(A) + hits(Ā)
  # = 11), so both land in a paying tier at the same time — no decorrelation at all;
  # a pair overlapping in nearly all numbers is the same ticket twice. Both are excluded.
  # Loto pays only at the high end, so there is no complement trap and overlap is simply
  # wasted redundancy: keep the systems nearly disjoint (neutral overlap is 7^2/45 ~ 1.1).
  overlap_range:
    sve_ili_nista: [3, 8]
    loto: [0, 2]
    default: [0, 99]
  exact_evaluations: 200   # subsets scored by exact joint distribution, best proxy first

evaluation:
  evaluation_start: "2026-01-01"   # draws before: training (descriptive + fitting); from here: evaluation
  primary_metric: mean_hits        # per draw, evaluation period
  primary_test: exact_two_sided    # exact convolution of the hypergeometric null
  correction: holm                 # family = every strategy evaluated on the pool (BH reported too)
  alpha: 0.05
  mc_replicates: 10000             # uniform random-ticket strategies
  bootstrap_replicates: 10000
  auc_bootstrap: 1000
  quality_replicates: 2000
  ensemble_beta: 0.5               # softmax temperature of the train-weighted ensemble (not tuned)
  extreme_tail:
    sve_ili_nista: [3, 8]          # secondary metric: hits <= 3 or >= 8 (both tails: "all" and "nothing")
  controls:
    hot_window: 30
    logistic_warmup: 100
    logistic_C: 1.0
    cv_splits: 5
