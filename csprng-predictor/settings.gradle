// Gradle build for Android Studio users.
// NOTE: this path is not exercised in the environment the project was built in
// (no Android SDK / Google Maven there); the verified build is scripts/build-apk.sh.
pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
    }
}

rootProject.name = "csprng-predictor"
include ':app'
